<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Y-Layer Gate</title>

    <style>
      /* ====== Base / Reset ====== */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial,
          sans-serif;
        background: radial-gradient(
          circle at 50% 40%,
          #101522 0%,
          #070914 50%,
          #04040b 100%
        );
        color: #fff;
        overflow: hidden;
      }

      /* ====== Back Button ====== */
      .back-btn {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 9999;
        padding: 10px 14px;
        border-radius: 14px;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        border: 1px solid rgba(255, 220, 120, 0.28);
        background: rgba(0, 0, 0, 0.35);
        color: rgba(255, 230, 170, 0.95);
        cursor: pointer;
        backdrop-filter: blur(8px);
        transition: transform 160ms ease, background 160ms ease,
          border-color 160ms ease;
      }
      .back-btn:hover {
        transform: translateY(-1px);
        background: rgba(0, 0, 0, 0.48);
        border-color: rgba(255, 230, 170, 0.55);
      }
      .back-btn:active {
        transform: translateY(0);
      }

      /* ====== Scene ====== */
      .scene {
        position: relative;
        height: 100vh;
        width: 100vw;
        display: grid;
        place-items: center;
        user-select: none;
      }

      /* subtle stars */
      .stars {
        position: absolute;
        inset: 0;
        background: radial-gradient(
            circle at 20% 30%,
            rgba(255, 255, 255, 0.12) 0 1px,
            transparent 2px
          ),
          radial-gradient(
            circle at 70% 20%,
            rgba(255, 255, 255, 0.1) 0 1px,
            transparent 2px
          ),
          radial-gradient(
            circle at 45% 75%,
            rgba(255, 255, 255, 0.08) 0 1px,
            transparent 2px
          ),
          radial-gradient(
            circle at 85% 60%,
            rgba(255, 255, 255, 0.07) 0 1px,
            transparent 2px
          ),
          radial-gradient(
            circle at 10% 80%,
            rgba(255, 255, 255, 0.06) 0 1px,
            transparent 2px
          );
        opacity: 0.35;
        filter: blur(0.2px);
        pointer-events: none;
      }

      /* ====== Monument ====== */
      .monument {
        position: relative;
        width: min(70vmin, 520px);
        height: min(80vmin, 620px);
        display: grid;
        place-items: center;
        transform-origin: center;
        transition: transform 700ms ease;
      }

      .y-letter {
        font-weight: 900;
        font-size: clamp(220px, 34vmin, 520px);
        letter-spacing: -0.04em;
        line-height: 0.9;
        color: #ffd86a;
        text-shadow: 0 0 10px rgba(255, 214, 90, 0.45),
          0 0 22px rgba(255, 214, 90, 0.35), 0 0 60px rgba(255, 195, 60, 0.25);
        filter: drop-shadow(0 40px 45px rgba(0, 0, 0, 0.55));
        animation: yPulse 2.6s ease-in-out infinite;
      }

      .aura {
        position: absolute;
        width: 115%;
        height: 115%;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 220, 120, 0.3),
          transparent 70%
        );
        filter: blur(2px);
        animation: auraWaver 3.2s ease-in-out infinite;
      }

      .streaks {
        position: absolute;
        inset: -20%;
        background: repeating-linear-gradient(
          110deg,
          transparent 0 24px,
          rgba(255, 220, 120, 0.08) 28px,
          transparent 36px
        );
        opacity: 0.55;
        filter: blur(1px);
        animation: streakDrift 2.9s linear infinite;
      }

      @keyframes yPulse {
        50% {
          transform: scale(1.02);
        }
      }
      @keyframes auraWaver {
        50% {
          transform: scale(1.06);
          opacity: 0.75;
        }
      }
      @keyframes streakDrift {
        to {
          background-position: 260px 0;
        }
      }

      /* ====== Gate ====== */
      .gate {
        position: absolute;
        bottom: 10%;
        left: 50%;
        transform: translateX(-50%);
        width: min(46%, 260px);
        height: min(20%, 130px);
        border-radius: 18px;
        border: 1px solid rgba(255, 220, 120, 0.35);
        background: linear-gradient(
          180deg,
          rgba(255, 220, 120, 0.1),
          rgba(20, 10, 2, 0.55)
        );
        box-shadow: 0 0 24px rgba(255, 220, 120, 0.18);
        cursor: pointer;
        display: grid;
        place-items: center;
      }

      .gate-inner {
        width: 92%;
        height: 78%;
        border-radius: 14px;
        background: radial-gradient(
          circle,
          rgba(255, 240, 190, 0.75),
          transparent 70%
        );
      }

      .gate-label {
        position: absolute;
        bottom: -34px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        letter-spacing: 0.22em;
        opacity: 0.85;
      }

      .flash {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle,
          rgba(255, 220, 120, 0.22),
          transparent 70%
        );
        opacity: 0;
        transition: opacity 220ms ease;
        pointer-events: none;
      }
      .flash.on {
        opacity: 1;
      }

      .scene.entering .monument {
        transform: scale(1.12);
      }

      /* ====== Modal ====== */
      .modal-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.62);
        display: none;
        place-items: center;
      }
      .modal-backdrop.open {
        display: grid;
      }

      .modal {
        width: min(560px, 92vw);
        border-radius: 18px;
        background: #0c0f1d;
        border: 1px solid rgba(255, 220, 120, 0.22);
        padding: 18px;
      }

      .close-btn {
        background: none;
        border: none;
        color: #fff;
        font-size: 20px;
        cursor: pointer;
        float: right;
      }
    </style>
  </head>

  <body>
    <!-- BACK BUTTON -->
    <button class="back-btn" id="backBtn">← Main World</button>

    <main class="scene" id="scene">
      <div class="stars"></div>

      <div class="monument">
        <div class="aura"></div>
        <div class="streaks"></div>
        <div class="y-letter">Y</div>

        <button class="gate" id="gateBtn">
          <div class="gate-inner"></div>
          <div class="gate-label">Enter the Y</div>
        </button>
      </div>

      <div class="flash" id="flash"></div>

      <section class="modal-backdrop" id="modalBackdrop">
        <div class="modal">
          <button class="close-btn" id="closeModalBtn">✕</button>
          <h2>Access Required</h2>
          <p>Create your access badge.</p>
          <input placeholder="Username" /><br /><br />
          <input placeholder="Email" />
        </div>
      </section>
    </main>

    <script>
      const scene = document.getElementById("scene");
      const flash = document.getElementById("flash");
      const gateBtn = document.getElementById("gateBtn");

      const modalBackdrop = document.getElementById("modalBackdrop");
      const closeModalBtn = document.getElementById("closeModalBtn");
      const backBtn = document.getElementById("backBtn");

      function openModal() {
        modalBackdrop.classList.add("open");
      }
      function closeModal() {
        modalBackdrop.classList.remove("open");
      }

      gateBtn.addEventListener("click", () => {
        scene.classList.add("entering");
        flash.classList.add("on");
        setTimeout(() => {
          flash.classList.remove("on");
          openModal();
          scene.classList.remove("entering");
        }, 520);
      });

      closeModalBtn.addEventListener("click", closeModal);

      // BACK BUTTON LOGIC (SAFE)
      backBtn.addEventListener("click", () => {
        if (modalBackdrop.classList.contains("open")) {
          closeModal();
          return;
        }
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = "index.html";
        }
      });
    </script>
  </body>
</html>
