<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A fully structured HTML Page" />
    <title>My Complete Website</title>
  </head>
  <body>
    <header>
      <h1>Welcome To My Webpage</h1>
      <p>This page contains various HTML elements we have learned</p>
    </header>
    <section>
      <h2>Topics Covered</h2>
      <ul>
        <li>Html Structure</li>
        <li>Meta Tags</li>
        <li>Headings, Paragraphs, Spans. and Divs</li>
        <li>List</li>
        <li>Tables</li>
        <li>Forms</li>
      </ul>
    </section>
    <section>
      <h2>Student Scores</h2>
      <table border="1">
        <tr>
          <th>Name</th>
          <th>Score</th>
        </tr>
        <tr>
          <td>Bob</td>
          <td>88</td>
        </tr>
        <tr>
          <td>Alice</td>
          <td>95</td>
        </tr>
        <tr>
            <td>Steve</td>
            <td>100</td>
        </tr>
      </table>
    </section>
    <section>
        <h2>Sign Up Form</h2>
        <form>
            <label for="name">Name</label>
            <input type="text" id="name" required />
            </br>
            <label for="email">Email</label>
            <input type="text" id="email" required />
            </br>
            <label for="pass">Password</label>
            <input type="text" id="pass" required />     
            </br>
            <select id="country">
                <option value="">Please Choose</option>
                <option value="USA">USA</option>
                <option value="Korea">Korea</option>
                <option value="Mexico">Mexico</option>            
            </select>
            </br>
            </br>
            <button type="submit">Sign Up</button>
        </form>
    </section>
    <footer></footer>
  </body>
</html>
